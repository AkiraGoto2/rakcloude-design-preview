<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор оформления RakCloude</title><link rel="stylesheet" href="designer.css"></head><body><header><strong>RakCloude <span>Редактор оформления</span></strong><div><button id="undo">Отменить</button><label class="import">Импорт JSON<input type="file" id="import" accept=".json"></label><button id="export" class="primary">Выгрузить настройки</button></div></header><main><aside><label>Единый каталог элементов<select id="page" hidden></select></label><div class="row"><label>Экран<select id="viewport"><option value="100%">Компьютер</option><option value="390px">Телефон · 390</option><option value="320px">Телефон · 320</option><option value="768px">Планшет · 768</option></select></label><label>Применить<select id="scope"><option value="all">Везде</option><option value="mobile">На мобильном</option><option value="desktop">На компьютере</option></select></label></div><label class="check"><input type="checkbox" id="picking" checked> Выбирать элементы нажатием</label><details open><summary>Цвета сайта и логотипа</summary><div id="tokens"></div></details><label>Элементы сайта<select id="objects" size="7"></select></label><section><h2 id="selection">Выбери элемент в каталоге</h2><p id="selector"></p><div id="properties"></div><button id="reset">Сбросить вид этого объекта</button></section><p class="note">Черновик сохраняется в браузере. Экспортированный JSON можно прикрепить к теме в админке. Выбор экрана не меняет область применения — укажи её отдельно.</p><p id="status" role="status"></p><a href="admin-design.html">Открыть темы в админке ↗</a></aside><div class="stage"><div id="frame-wrap"><iframe id="preview" title="Предпросмотр страницы" src="components.html"></iframe></div></div></main><script src="design-settings.js"></script><script src="designer.js"></script></body></html>
